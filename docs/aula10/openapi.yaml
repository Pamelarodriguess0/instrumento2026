openapi: 3.1.0
info:
  title: API de Controle de Instrumentos Musicais
  description: "API para gerenciamento de instrumentos musicais, categorias, fornecedores,\
    \ estoque, pessoas, clientes, colaboradores e vendas."
  contact:
    name: Curso de Spring Boot 2026
  version: 1.0.0
externalDocs:
  description: Material didático do projeto
  url: https://github.com/jeffersonarpasserini/suporteos2026
servers:
- url: http://localhost
  description: Generated server url
tags:
- name: Categorias
  description: "Operações de cadastro, consulta, atualização, exclusão e alteraçã\
    o de status das categorias de instrumentos musicais"
- name: Instrumentos
  description: "Operações de cadastro, consulta, atualização, exclusão e controle\
    \ de estoque de instrumentos musicais"
- name: Infraestrutura
  description: Endpoints para verificação da disponibilidade da API
- name: Fornecedores
  description: Operações de cadastro e consulta de fornecedores de instrumentos musicais
paths:
  /api/pessoas/{id}:
    get:
      tags:
      - Pessoas
      summary: Buscar pessoa por ID
      operationId: buscarPorId
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Recurso encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PessoaResponse"
        "404":
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags:
      - Pessoas
      summary: Atualizar pessoa
      operationId: alterar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PessoaRequest"
        required: true
      responses:
        "200":
          description: Cadastro atualizado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PessoaResponse"
        "400":
          description: Dados ou regra de negócio inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: CPF ou e-mail já cadastrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/pessoas/{id}/status:
    put:
      tags:
      - Pessoas
      summary: Alterar status da pessoa
      operationId: alterarStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusRequest"
        required: true
      responses:
        "200":
          description: Status atualizado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PessoaResponse"
        "400":
          description: Dados ou regra de negócio inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/instrumentos/{id}:
    get:
      tags:
      - Instrumentos
      summary: Buscar instrumento por ID
      description: Consulta os dados de um instrumento musical pelo seu identificador.
      operationId: buscarPorId_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Instrumento encontrado com sucesso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InstrumentoResponse"
        "404":
          description: Instrumento não encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags:
      - Instrumentos
      summary: Atualizar instrumento
      description: "Atualiza o nome, preço, estoque mínimo, categoria e fornecedor\
        \ de um instrumento musical."
      operationId: alterar_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstrumentoAtualizacaoRequest"
        required: true
      responses:
        "200":
          description: Instrumento atualizado com sucesso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InstrumentoResponse"
        "400":
          description: Dados inválidos para atualização do instrumento
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "Instrumento, categoria ou fornecedor não encontrado"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
      - Instrumentos
      summary: Excluir instrumento
      description: Exclui um instrumento musical pelo seu identificador.
      operationId: excluir
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Instrumento excluído com sucesso
        "404":
          description: Instrumento não encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Instrumento vinculado a uma venda; o histórico deve ser preservado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/instrumentos/{id}/status:
    put:
      tags:
      - Instrumentos
      summary: Alterar status do instrumento
      description: Ativa ou inativa um instrumento musical.
      operationId: alterarStatus_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusRequest"
        required: true
      responses:
        "200":
          description: Status do instrumento alterado com sucesso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InstrumentoResponse"
        "400":
          description: Status inválido ou não informado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Instrumento não encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/colaboradores/{id}:
    get:
      tags:
      - Colaboradores
      summary: Buscar colaborador por ID
      operationId: buscarPorId_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Recurso encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ColaboradorResponse"
        "404":
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags:
      - Colaboradores
      summary: Atualizar colaborador
      operationId: alterar_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColaboradorAtualizacaoRequest"
        required: true
      responses:
        "200":
          description: Cadastro atualizado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ColaboradorResponse"
        "400":
          description: Dados ou regra de negócio inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Pessoa já possui vínculo ou matrícula já cadastrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/clientes/{id}:
    get:
      tags:
      - Clientes
      summary: Buscar cliente por ID
      operationId: buscarPorId_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Recurso encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClienteResponse"
        "404":
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags:
      - Clientes
      summary: Atualizar cliente
      operationId: alterar_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClienteAtualizacaoRequest"
        required: true
      responses:
        "200":
          description: Cadastro atualizado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClienteResponse"
        "400":
          description: Dados ou regra de negócio inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/categorias/{id}:
    get:
      tags:
      - Categorias
      summary: Buscar categoria por ID
      description: Consulta uma categoria pelo seu identificador.
      operationId: buscarPorId_4
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Categoria encontrada com sucesso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CategoriaInstrumentoResponse"
        "404":
          description: Categoria não encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags:
      - Categorias
      summary: Atualizar categoria
      description: Atualiza o nome de uma categoria de instrumentos musicais.
      operationId: alterar_4
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaInstrumentoAtualizacaoRequest"
        required: true
      responses:
        "200":
          description: Categoria atualizada com sucesso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CategoriaInstrumentoResponse"
        "400":
          description: Dados inválidos para atualização
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Categoria não encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Nome da categoria já cadastrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
      - Categorias
      summary: Excluir categoria
      description: Exclui uma categoria que não possui instrumentos vinculados.
      operationId: excluir_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Categoria excluída com sucesso
        "404":
          description: Categoria não encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Categoria não pode ser excluída porque possui instrumentos
            vinculados
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/categorias/{id}/status:
    put:
      tags:
      - Categorias
      summary: Alterar status da categoria
      description: Ativa ou inativa uma categoria de instrumentos musicais.
      operationId: alterarStatus_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusRequest"
        required: true
      responses:
        "200":
          description: Status da categoria alterado com sucesso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CategoriaInstrumentoResponse"
        "400":
          description: Status inválido ou não informado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Categoria não encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/vendas:
    get:
      tags:
      - Vendas
      summary: Pesquisar vendas
      description: "Retorna resumos sem itens ou total. Datas inicial e final inclusivas;\
        \ período invertido retorna 400. Ordenação por id, dataVenda ou status; pá\
        gina padrão 20, limite 100."
      operationId: pesquisar
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ABERTA
          - FINALIZADA
          - CANCELADA
      - name: clienteId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: vendedorId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: dataInicial
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: dataFinal
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "id,ASC"
          items:
            type: string
      responses:
        "200":
          description: Pesquisa paginada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaginaResponseVendaResumoResponse"
        "400":
          description: Dados ou regra de negócio inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
      - Vendas
      summary: Cadastrar venda
      operationId: cadastrar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendaRequest"
        required: true
      responses:
        "201":
          description: Cadastro realizado
          headers:
            Location:
              description: URI do recurso criado
              style: simple
              schema:
                type: string
                format: uri
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VendaResponse"
        "400":
          description: Dados ou regra de negócio inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/vendas/{id}/itens:
    post:
      tags:
      - Vendas
      summary: Adicionar instrumento à venda
      description: Quantidade em unidades inteiras; o preço atual é preservado no
        item.
      operationId: adicionarItem
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemVendaRequest"
        required: true
      responses:
        "200":
          description: Item adicionado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VendaResponse"
        "400":
          description: Dados ou regra de negócio inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/vendas/{id}/finalizacao:
    post:
      tags:
      - Vendas
      summary: Finalizar venda e baixar estoque
      description: "Somente venda aberta e não vazia, com participantes habilitados,\
        \ instrumentos ativos e saldo suficiente. As baixas são atômicas; falhas preservam\
        \ os saldos e a venda aberta. Repetir a finalização retorna 400 sem nova baixa."
      operationId: finalizar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Venda finalizada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VendaResponse"
        "400":
          description: Dados ou regra de negócio inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/vendas/{id}/cancelamento:
    post:
      tags:
      - Vendas
      summary: Cancelar venda aberta
      description: Cancela sem movimentar estoque. Venda finalizada ou cancelada retorna
        400; não realiza estorno.
      operationId: cancelar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Venda cancelada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VendaResponse"
        "400":
          description: Dados ou regra de negócio inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/pessoas:
    get:
      tags:
      - Pessoas
      summary: Pesquisar pessoas
      operationId: pesquisar_1
      parameters:
      - name: nome
        in: query
        required: false
        schema:
          type: string
      - name: cpf
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ATIVO
          - INATIVO
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "id,ASC"
          items:
            type: string
      responses:
        "200":
          description: Pesquisa paginada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaginaResponsePessoaResponse"
        "400":
          description: Dados ou regra de negócio inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
      - Pessoas
      summary: Cadastrar pessoa
      operationId: cadastrar_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PessoaRequest"
        required: true
      responses:
        "201":
          description: Cadastro realizado
          headers:
            Location:
              description: URI do recurso criado
              style: simple
              schema:
                type: string
                format: uri
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PessoaResponse"
        "400":
          description: Dados ou regra de negócio inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: CPF ou e-mail já cadastrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/instrumentos:
    get:
      tags:
      - Instrumentos
      summary: Pesquisar instrumentos
      description: Pesquisa instrumentos musicais utilizando filtros e paginação.
      operationId: pesquisar_2
      parameters:
      - name: nomeInstrumento
        in: query
        description: Filtra instrumentos pelo nome
        required: false
        schema:
          type: string
        example: Violino
      - name: status
        in: query
        description: Filtra instrumentos pelo status
        required: false
        schema:
          type: string
          enum:
          - ATIVO
          - INATIVO
        example: ATIVO
      - name: categoriaId
        in: query
        description: Filtra instrumentos pelo identificador da categoria
        required: false
        schema:
          type: integer
          format: int64
        example: 1
      - name: fornecedorId
        in: query
        description: Filtra instrumentos pelo identificador do fornecedor
        required: false
        schema:
          type: integer
          format: int64
        example: 1
      - name: abaixoEstoqueMinimo
        in: query
        description: Filtra instrumentos abaixo do estoque mínimo
        required: false
        schema:
          type: boolean
        example: true
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "id,ASC"
          items:
            type: string
      responses:
        "200":
          description: Pesquisa realizada com sucesso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaginaResponseInstrumentoResponse"
        "400":
          description: Parâmetros de pesquisa ou ordenação inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
      - Instrumentos
      summary: Cadastrar instrumento
      description: Cadastra um novo instrumento musical no sistema.
      operationId: cadastrar_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstrumentoRequest"
        required: true
      responses:
        "201":
          description: Instrumento cadastrado com sucesso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InstrumentoResponse"
        "400":
          description: Dados inválidos para cadastro
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Categoria ou fornecedor não encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Código do instrumento já cadastrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/instrumentos/{id}/estoque/saidas:
    post:
      tags:
      - Instrumentos
