components:
  schemas:
    PessoaRequest:
      type: object
      description: "Dados civis; CPF sem pontuação, com dígitos verificadores válidos"
      properties:
        nome:
          type: string
          example: Ana Souza
          maxLength: 150
          minLength: 0
        email:
          type: string
          format: email
          example: ana@example.com
          maxLength: 180
          minLength: 0
        cpf:
          type: string
          description: "CPF com 11 dígitos e verificadores válidos, sem pontuação;\
            \ não comprova titularidade"
          example: "52998224725"
          maxLength: 11
          minLength: 11
          pattern: "^[0-9]{11}$"
      required:
      - cpf
      - email
      - nome
    ApiError:
      type: object
      description: Representação padronizada de erros da API
      properties:
        timestamp:
          type: string
          format: date-time
          description: Data e hora em que ocorreu o erro
        status:
          type: integer
          format: int32
          description: Código HTTP do erro
          example: 404
        error:
          type: string
          description: Descrição do status HTTP
          example: Not Found
        message:
          type: string
          description: Mensagem explicativa do erro
          example: Instrumento não encontrado
        path:
          type: string
          description: Caminho da requisição que gerou o erro
          example: /api/instrumentos/999
        fields:
          type: object
          additionalProperties:
            type: string
          description: Erros de validação associados aos campos da requisição
    PessoaResponse:
      type: object
      description: Identidade civil compartilhada pelos papéis comerciais
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nome:
          type: string
          example: Ana Souza
        email:
          type: string
          example: ana@example.com
        cpf:
          type: string
          description: "CPF com 11 dígitos e verificadores válidos, sem pontuação;\
            \ não comprova titularidade"
          example: "52998224725"
          maxLength: 11
          minLength: 11
          pattern: "^[0-9]{11}$"
        dataCadastro:
          type: string
          format: date
          example: 2026-10-28
        status:
          type: string
          enum:
          - ATIVO
          - INATIVO
          example: ATIVO
    StatusRequest:
      type: object
      description: Dados necessários para alterar o status de um instrumento ou categoria
      properties:
        status:
          type: string
          description: Novo status do registro
          enum:
          - ATIVO
          - INATIVO
          example: ATIVO
      required:
      - status
    InstrumentoAtualizacaoRequest:
      type: object
      description: Dados para atualização de um instrumento musical
      properties:
        nomeInstrumento:
          type: string
          description: Novo nome do instrumento
          example: Violino Eagle
          maxLength: 150
          minLength: 0
        precoUnitario:
          type: number
          description: Preço unitário do instrumento
          example: 1800.0
          exclusiveMinimum: 0
          minimum: 0
        estoqueMinimo:
          type: number
          description: Quantidade mínima desejada em estoque
          example: 2.0
          minimum: 0
        categoriaId:
          type: integer
          format: int64
          description: Identificador da categoria
          example: 1
          exclusiveMinimum: 0
          minimum: 1
        fornecedorId:
          type:
          - integer
          - "null"
          format: int64
          description: "Identificador do fornecedor, quando informado"
          example: 1
          exclusiveMinimum: 0
          minimum: 1
      required:
      - categoriaId
      - estoqueMinimo
      - nomeInstrumento
      - precoUnitario
    InstrumentoResponse:
      type: object
      description: Dados de um instrumento musical retornados pela API
      properties:
        id:
          type: integer
          format: int64
          description: Identificador do instrumento
          example: 1
        codigoInstrumento:
          type: string
          description: Código único do instrumento
          example: INT001
        nomeInstrumento:
          type: string
          description: Nome do instrumento
          example: Violino Eagle
        quantidadeEstoque:
          type: integer
          format: int32
          description: Quantidade disponível em estoque
          example: 10
        precoUnitario:
          type: number
          description: Preço unitário do instrumento
          example: 1800.0
        estoqueMinimo:
          type: number
          description: Estoque mínimo do instrumento
          example: 2.0
        valorEstoque:
          type: number
          description: Valor total dos instrumentos em estoque
          example: 18000.0
        dataCadastro:
          type: string
          format: date
          description: Data de cadastro do instrumento
          example: 2026-10-20
        status:
          type: string
          description: Status atual do instrumento
          enum:
          - ATIVO
          - INATIVO
          example: ATIVO
        categoriaId:
          type: integer
          format: int64
          description: Identificador da categoria
          example: 1
        categoriaNome:
          type: string
          description: Nome da categoria
          example: Cordas
        fornecedorId:
          type:
          - integer
          - "null"
          format: int64
          description: "Identificador do fornecedor, quando vinculado"
          example: 1
        fornecedorRazaoSocial:
          type:
          - string
          - "null"
          description: "Razão social do fornecedor, quando vinculado"
          example: Instrumentos Musicais Brasil Ltda
    ColaboradorAtualizacaoRequest:
      type: object
      description: Altera matrícula e função; preserva pessoa e data de admissão
      properties:
        matricula:
          type: string
          example: VEN-001
          maxLength: 30
          minLength: 0
        funcao:
          type: string
          enum:
          - VENDEDOR
          - ESTOQUISTA
          - GERENTE
          - ADMINISTRATIVO
          example: VENDEDOR
      required:
      - funcao
      - matricula
    ColaboradorResponse:
      type: object
      description: Vínculo profissional; função não representa permissão de acesso
      properties:
        id:
          type: integer
          format: int64
          example: 1
        pessoaId:
          type: integer
          format: int64
          example: 1
        nome:
          type: string
          example: Ana Souza
        email:
          type: string
          example: ana@example.com
        cpf:
          type: string
          description: "CPF com 11 dígitos e verificadores válidos, sem pontuação;\
            \ não comprova titularidade"
          example: "52998224725"
          maxLength: 11
          minLength: 11
          pattern: "^[0-9]{11}$"
        matricula:
          type: string
          example: VEN-001
        funcao:
          type: string
          enum:
          - VENDEDOR
          - ESTOQUISTA
          - GERENTE
          - ADMINISTRATIVO
          example: VENDEDOR
        dataAdmissao:
          type: string
          format: date
          example: 2026-09-29
    ClienteAtualizacaoRequest:
      type: object
      description: Altera somente o telefone; não substitui a pessoa
      properties:
        telefone:
          type: string
          example: (11) 99999-0000
          maxLength: 30
          minLength: 0
    ClienteResponse:
      type: object
      description: Cliente e dados de sua pessoa
      properties:
        id:
          type: integer
          format: int64
          example: 1
        pessoaId:
          type: integer
          format: int64
          example: 1
        nome:
          type: string
          example: Ana Souza
        email:
          type: string
          example: ana@example.com
        cpf:
          type: string
          description: "CPF com 11 dígitos e verificadores válidos, sem pontuação;\
            \ não comprova titularidade"
          example: "52998224725"
          maxLength: 11
          minLength: 11
          pattern: "^[0-9]{11}$"
        telefone:
          type: string
          example: (11) 99999-0000
    CategoriaInstrumentoAtualizacaoRequest:
      type: object
      description: Dados necessários para atualizar uma categoria de instrumentos
        musicais
      properties:
        nome:
          type: string
          description: Novo nome da categoria
          example: Instrumentos de Cordas
          maxLength: 120
          minLength: 0
      required:
      - nome
    CategoriaInstrumentoResponse:
      type: object
      description: Dados de uma categoria de instrumentos musicais retornados pela
        API
      properties:
        id:
          type: integer
          format: int64
          description: Identificador da categoria
          example: 1
        nome:
          type: string
          description: Nome da categoria
          example: Instrumentos de Cordas
        status:
          type: string
          description: Status atual da categoria
          enum:
          - ATIVO
          - INATIVO
          example: ATIVO
    VendaRequest:
      type: object
      description: Abre venda para cliente ativo e vendedor ou gerente ativo
      properties:
        clienteId:
          type: integer
          format: int64
          example: 1
          exclusiveMinimum: 0
        vendedorId:
          type: integer
          format: int64
          example: 2
          exclusiveMinimum: 0
      required:
      - clienteId
      - vendedorId
    ItemVendaResponse:
      type: object
      description: Item com preço histórico capturado na inclusão e subtotal calculado
      properties:
        id:
          type: integer
          format: int64
          example: 1
        instrumentoId:
          type: integer
          format: int64
          example: 1
        instrumentoNome:
          type: string
          example: Violino Eagle
        quantidade:
          type: number
          example: 2
        valorUnitario:
          type: number
          example: 1500.0
        subtotal:
          type: number
          example: 3000.0
    VendaResponse:
      type: object
      description: "Detalhe da venda com itens, preços históricos e total calculado"
      properties:
        id:
          type: integer
          format: int64
          example: 1
        clienteId:
          type: integer
          format: int64
          example: 1
        clienteNome:
          type: string
          example: Ana Souza
        vendedorId:
          type: integer
          format: int64
          example: 2
        vendedorNome:
          type: string
          example: Bruno Lima
        dataVenda:
          type: string
          format: date-time
          example: 2026-10-28T10:30:00
        status:
          type: string
          enum:
          - ABERTA
          - FINALIZADA
          - CANCELADA
          example: ABERTA
        itens:
          type: array
          description: Itens com preço histórico capturado na inclusão
          items:
            $ref: "#/components/schemas/ItemVendaResponse"
        total:
          type: number
          example: 3000.0
    ItemVendaRequest:
      type: object
      description: "Inclusão de instrumento em venda aberta, em unidades inteiras"
      properties:
        instrumentoId:
          type: integer
          format: int64
          example: 1
          exclusiveMinimum: 0
        quantidade:
          type: integer
          format: int32
          description: "Quantidade inteira positiva de instrumentos; aceita 2 ou 2.000,\
            \ rejeita frações"
          example: 2
          maximum: 2147483647
          minimum: 1
          multipleOf: 1
      required:
      - instrumentoId
      - quantidade
    InstrumentoRequest:
      type: object
      description: Dados necessários para cadastrar um instrumento musical
      properties:
        codigoInstrumento:
          type: string
          description: Código único do instrumento
          example: INT001
          maxLength: 50
          minLength: 0
        nomeInstrumento:
          type: string
          description: Nome do instrumento musical
          example: Violino
          maxLength: 150
          minLength: 0
        quantidadeEstoque:
          type: integer
          format: int32
          description: Quantidade inicial disponível em estoque
          example: 10
          minimum: 0
        precoUnitario:
          type: number
          description: Preço unitário do instrumento
          example: 1500.0
          minimum: 0
        estoqueMinimo:
          type: number
          description: Quantidade mínima desejada em estoque
          example: 2.0
          minimum: 0
        categoriaId:
          type: integer
          format: int64
          description: Identificador da categoria do instrumento
          example: 1
          exclusiveMinimum: 0
          minimum: 1
        fornecedorId:
          type:
          - integer
          - "null"
          format: int64
          description: "Identificador do fornecedor, quando informado"
          example: 1
          exclusiveMinimum: 0
          minimum: 1
      required:
      - categoriaId
      - codigoInstrumento
      - estoqueMinimo
      - nomeInstrumento
      - precoUnitario
    MovimentacaoEstoqueRequest:
      type: object
      description: Dados necessários para registrar uma entrada ou saída de estoque
      properties:
        quantidade:
          type: number
          description: Quantidade de instrumentos a movimentar. Deve ser maior que
            zero
          example: 5.0
          exclusiveMinimum: 0
          minimum: 0
      required:
      - quantidade
    FornecedorRequest:
      type: object
      description: Dados necessários para cadastrar um fornecedor de instrumentos
        musicais
      properties:
        razaoSocial:
          type: string
          description: Razão social do fornecedor
          example: Instrumentos Musicais Brasil Ltda
          maxLength: 150
          minLength: 0
        cnpj:
          type: string
          description: "CNPJ do fornecedor, com 14 dígitos e dígitos verificadores\
            \ válidos, sem pontuação"
          example: "12345678000195"
          maxLength: 14
          minLength: 14
      required:
      - cnpj
      - razaoSocial
    FornecedorResponse:
      type: object
      description: Dados de um fornecedor retornados pela API
      properties:
        id:
          type: integer
          format: int64
          description: Identificador do fornecedor
          example: 1
        razaoSocial:
          type: string
          description: Razão social do fornecedor
          example: Instrumentos Musicais Brasil Ltda
        cnpj:
          type: string
          description: CNPJ do fornecedor
          example: "12345678000195"
        status:
          type: string
          description: Status atual do fornecedor
          enum:
          - ATIVO
          - INATIVO
          example: ATIVO
    ColaboradorRequest:
      type: object
      description: Cria vínculo profissional para uma pessoa ativa
      properties:
        pessoaId:
          type: integer
          format: int64
          example: 1
          exclusiveMinimum: 0
        matricula:
          type: string
          example: VEN-001
          maxLength: 30
          minLength: 0
        funcao:
          type: string
          enum:
          - VENDEDOR
          - ESTOQUISTA
          - GERENTE
          - ADMINISTRATIVO
          example: VENDEDOR
        dataAdmissao:
          type: string
          format: date
          example: 2026-09-29
      required:
      - dataAdmissao
      - funcao
      - matricula
      - pessoaId
    ClienteRequest:
      type: object
      description: Associa uma pessoa ativa ao papel de cliente
      properties:
        pessoaId:
          type: integer
          format: int64
          example: 1
          exclusiveMinimum: 0
        telefone:
          type: string
          example: (11) 99999-0000
          maxLength: 30
          minLength: 0
      required:
      - pessoaId
    CategoriaInstrumentoRequest:
      type: object
      description: Dados necessários para cadastrar uma categoria de instrumentos
        musicais
      properties:
        nome:
          type: string
          description: Nome da categoria de instrumentos musicais
          example: Instrumentos de Sopro
          maxLength: 120
          minLength: 0
      required:
      - nome
