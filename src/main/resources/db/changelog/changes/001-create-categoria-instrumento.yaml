databaseChangeLog:

  - changeSet:
      id: 001-01-create-categoria-instrumento
      author: pamela
      comment: Cria a tabela que classifica os instrumentos.
      changes:
        - createTable:
            tableName: categoria_instrumento
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_categoria_instrumento
                    nullable: false

              - column:
                  name: nome
                  type: VARCHAR(120)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

      rollback:
        - dropTable:
            tableName: categoria_instrumento


  - changeSet:
      id: 001-02-check-status-categoria-instrumento
      author: pamela
      comment: Restringe o status aos valores definidos no enum Java.
      changes:
        - sql:
            sql: >
              ALTER TABLE categoria_instrumento
              ADD CONSTRAINT ck_categoria_instrumento_status
              CHECK (status IN ('ATIVO', 'INATIVO'))

      rollback:
        - sql:
            sql: >
              ALTER TABLE categoria_instrumento
              DROP CONSTRAINT ck_categoria_instrumento_status