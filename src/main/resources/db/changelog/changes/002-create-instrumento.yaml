databaseChangeLog:

  - changeSet:
      id: 002-01-create-instrumento
      author: pamela
      changes:
        - createTable:
            tableName: instrumento
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_instrumento
                    nullable: false

              - column:
                  name: codigo_instrumento
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: nome_instrumento
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: quantidade_estoque
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: preco_unitario
                  type: NUMERIC(18,2)
                  constraints:
                    nullable: false

              - column:
                  name: data_cadastro
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: categoria_instrumento_id
                  type: BIGINT
                  constraints:
                    nullable: false

      rollback:
        - dropTable:
            tableName: instrumento


  - changeSet:
      id: 002-02-unique-codigo-instrumento
      author: pamela
      changes:
        - addUniqueConstraint:
            tableName: instrumento
            columnNames: codigo_instrumento
            constraintName: uk_instrumento_codigo_instrumento

      rollback:
        - dropUniqueConstraint:
            tableName: instrumento
            constraintName: uk_instrumento_codigo_instrumento


  - changeSet:
      id: 002-03-foreign-key-categoria-instrumento
      author: pamela
      changes:
        - addForeignKeyConstraint:
            baseTableName: instrumento
            baseColumnNames: categoria_instrumento_id
            referencedTableName: categoria_instrumento
            referencedColumnNames: id
            constraintName: fk_instrumento_categoria_instrumento
            onDelete: RESTRICT

      rollback:
        - dropForeignKeyConstraint:
            baseTableName: instrumento
            constraintName: fk_instrumento_categoria_instrumento


  - changeSet:
      id: 002-04-check-quantidade-estoque
      author: pamela
      changes:
        - sql:
            sql: >
              ALTER TABLE instrumento
              ADD CONSTRAINT ck_instrumento_quantidade_estoque
              CHECK (quantidade_estoque >= 0)

      rollback:
        - sql:
            sql: >
              ALTER TABLE instrumento
              DROP CONSTRAINT ck_instrumento_quantidade_estoque


  - changeSet:
      id: 002-05-check-preco-unitario
      author: pamela
      changes:
        - sql:
            sql: >
              ALTER TABLE instrumento
              ADD CONSTRAINT ck_instrumento_preco_unitario
              CHECK (preco_unitario > 0)

      rollback:
        - sql:
            sql: >
              ALTER TABLE instrumento
              DROP CONSTRAINT ck_instrumento_preco_unitario


  - changeSet:
      id: 002-06-check-status-instrumento
      author: pamela
      changes:
        - sql:
            sql: >
              ALTER TABLE instrumento
              ADD CONSTRAINT ck_instrumento_status
              CHECK (status IN ('ATIVO', 'INATIVO'))

      rollback:
        - sql:
            sql: >
              ALTER TABLE instrumento
              DROP CONSTRAINT ck_instrumento_status