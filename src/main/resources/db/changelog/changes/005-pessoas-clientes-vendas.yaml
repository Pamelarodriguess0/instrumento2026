databaseChangeLog:

  - changeSet:
      id: 005-01-create-pessoa
      author: curso-spring-2026
      changes:
        - createTable:
            tableName: pessoa
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_pessoa
              - column:
                  name: nome
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(180)
                  constraints:
                    nullable: false
              - column:
                  name: cpf
                  type: VARCHAR(11)
                  constraints:
                    nullable: false
              - column:
                  name: data_cadastro
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: pessoa

  - changeSet:
      id: 005-02-unique-email-normalizado-pessoa
      author: curso-spring-2026
      changes:
        - sql:
            sql: >
              CREATE UNIQUE INDEX uk_pessoa_email_normalizado ON pessoa (LOWER(BTRIM(email)))
      rollback:
        - sql:
            sql: DROP INDEX uk_pessoa_email_normalizado

  - changeSet:
      id: 005-03-unique-uk_pessoa_cpf
      author: curso-spring-2026
      changes:
        - addUniqueConstraint:
            tableName: pessoa
            columnNames: cpf
            constraintName: uk_pessoa_cpf
      rollback:
        - dropUniqueConstraint:
            tableName: pessoa
            constraintName: uk_pessoa_cpf

  - changeSet:
      id: 005-04-check-pessoa
      author: curso-spring-2026
      changes:
        - sql:
            sql: >
              ALTER TABLE pessoa ADD CONSTRAINT ck_pessoa_cpf_formato CHECK (cpf ~ '^[0-9]{11}$');
              ALTER TABLE pessoa ADD CONSTRAINT ck_pessoa_status CHECK (status IN ('ATIVO', 'INATIVO'));
      rollback:
        - sql:
            sql: >
              ALTER TABLE pessoa DROP CONSTRAINT ck_pessoa_status;
              ALTER TABLE pessoa DROP CONSTRAINT ck_pessoa_cpf_formato;

  - changeSet:
      id: 005-05-create-cliente
      author: curso-spring-2026
      changes:
        - createTable:
            tableName: cliente
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_cliente
              - column:
                  name: pessoa_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: telefone
                  type: VARCHAR(30)
      rollback:
        - dropTable:
            tableName: cliente

  - changeSet:
      id: 005-06-unique-uk_cliente_pessoa
      author: curso-spring-2026
      changes:
        - addUniqueConstraint:
            tableName: cliente
            columnNames: pessoa_id
            constraintName: uk_cliente_pessoa
      rollback:
        - dropUniqueConstraint:
            tableName: cliente
            constraintName: uk_cliente_pessoa

  - changeSet:
      id: 005-07-fk_cliente_pessoa
      author: curso-spring-2026
      changes:
        - addForeignKeyConstraint:
            baseTableName: cliente
            baseColumnNames: pessoa_id
            referencedTableName: pessoa
            referencedColumnNames: id
            constraintName: fk_cliente_pessoa
            onDelete: RESTRICT
            onUpdate: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: cliente
            constraintName: fk_cliente_pessoa

  - changeSet:
      id: 005-08-create-colaborador
      author: curso-spring-2026
      changes:
        - createTable:
            tableName: colaborador
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_colaborador
              - column:
                  name: pessoa_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: matricula
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: funcao
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: data_admissao
                  type: DATE
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: colaborador

  - changeSet:
      id: 005-09-unique-uk_colaborador_pessoa
      author: curso-spring-2026
      changes:
        - addUniqueConstraint:
            tableName: colaborador
            columnNames: pessoa_id
            constraintName: uk_colaborador_pessoa
      rollback:
        - dropUniqueConstraint:
            tableName: colaborador
            constraintName: uk_colaborador_pessoa

  - changeSet:
      id: 005-10-unique-uk_colaborador_matricula
      author: curso-spring-2026
      changes:
        - addUniqueConstraint:
            tableName: colaborador
            columnNames: matricula
            constraintName: uk_colaborador_matricula
      rollback:
        - dropUniqueConstraint:
            tableName: colaborador
            constraintName: uk_colaborador_matricula

  - changeSet:
      id: 005-11-fk_colaborador_pessoa
      author: curso-spring-2026
      changes:
        - addForeignKeyConstraint:
            baseTableName: colaborador
            baseColumnNames: pessoa_id
            referencedTableName: pessoa
            referencedColumnNames: id
            constraintName: fk_colaborador_pessoa
            onDelete: RESTRICT
            onUpdate: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: colaborador
            constraintName: fk_colaborador_pessoa

  - changeSet:
      id: 005-12-check-colaborador
      author: curso-spring-2026
      changes:
        - sql:
            sql: >
              ALTER TABLE colaborador ADD CONSTRAINT ck_colaborador_funcao CHECK (funcao IN ('VENDEDOR', 'ESTOQUISTA', 'GERENTE', 'ADMINISTRATIVO'));
      rollback:
        - sql:
            sql: >
              ALTER TABLE colaborador DROP CONSTRAINT ck_colaborador_funcao;

  - changeSet:
      id: 005-13-create-venda
      author: curso-spring-2026
      changes:
        - createTable:
            tableName: venda
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_venda
              - column:
                  name: cliente_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: vendedor_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: data_venda
                  type: TIMESTAMP(6)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: venda

  - changeSet:
      id: 005-14-fk_venda_cliente
      author: curso-spring-2026
      changes:
        - addForeignKeyConstraint:
            baseTableName: venda
            baseColumnNames: cliente_id
            referencedTableName: cliente
            referencedColumnNames: id
            constraintName: fk_venda_cliente
            onDelete: RESTRICT
            onUpdate: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: venda
            constraintName: fk_venda_cliente

  - changeSet:
      id: 005-15-fk_venda_vendedor
      author: curso-spring-2026
      changes:
        - addForeignKeyConstraint:
            baseTableName: venda
            baseColumnNames: vendedor_id
            referencedTableName: colaborador
            referencedColumnNames: id
            constraintName: fk_venda_vendedor
            onDelete: RESTRICT
            onUpdate: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: venda
            constraintName: fk_venda_vendedor

  - changeSet:
      id: 005-16-check-venda
      author: curso-spring-2026
      changes:
        - sql:
            sql: >
              ALTER TABLE venda ADD CONSTRAINT ck_venda_status CHECK (status IN ('ABERTA', 'FINALIZADA', 'CANCELADA'));
      rollback:
        - sql:
            sql: >
              ALTER TABLE venda DROP CONSTRAINT ck_venda_status;

  - changeSet:
      id: 005-17-create-item_venda
      author: curso-spring-2026
      changes:
        - createTable:
            tableName: item_venda
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_item_venda
              - column:
                  name: venda_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: instrumento_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: quantidade
                  type: NUMERIC(18,3)
                  constraints:
                    nullable: false
              - column:
                  name: valor_unitario
                  type: NUMERIC(18,2)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: item_venda

  - changeSet:
      id: 005-18-unique-uk_item_venda_instrumento
      author: curso-spring-2026
      changes:
        - addUniqueConstraint:
            tableName: item_venda
            columnNames: venda_id, instrumento_id
            constraintName: uk_item_venda_instrumento
      rollback:
        - dropUniqueConstraint:
            tableName: item_venda
            constraintName: uk_item_venda_instrumento

  - changeSet:
      id: 005-19-fk_item_venda_venda
      author: curso-spring-2026
      changes:
        - addForeignKeyConstraint:
            baseTableName: item_venda
            baseColumnNames: venda_id
            referencedTableName: venda
            referencedColumnNames: id
            constraintName: fk_item_venda_venda
            onDelete: CASCADE
            onUpdate: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: item_venda
            constraintName: fk_item_venda_venda

  - changeSet:
      id: 005-20-fk_item_venda_instrumento
      author: curso-spring-2026
      changes:
        - addForeignKeyConstraint:
            baseTableName: item_venda
            baseColumnNames: instrumento_id
            referencedTableName: instrumento
            referencedColumnNames: id
            constraintName: fk_item_venda_instrumento
            onDelete: RESTRICT
            onUpdate: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: item_venda
            constraintName: fk_item_venda_instrumento

  - changeSet:
      id: 005-21-check-item_venda
      author: curso-spring-2026
      changes:
        - sql:
            sql: >
              ALTER TABLE item_venda ADD CONSTRAINT ck_item_venda_quantidade CHECK (quantidade > 0 AND quantidade = TRUNC(quantidade) AND quantidade <= 2147483647);
              ALTER TABLE item_venda ADD CONSTRAINT ck_item_venda_valor_unitario CHECK (valor_unitario >= 0);
      rollback:
        - sql:
            sql: >
              ALTER TABLE item_venda DROP CONSTRAINT ck_item_venda_valor_unitario;
              ALTER TABLE item_venda DROP CONSTRAINT ck_item_venda_quantidade;
